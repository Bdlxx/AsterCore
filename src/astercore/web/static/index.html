<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>栖星 AsterCore</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><path fill=%22%231E40AF%22 d=%22M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z%22/></svg>">
<!-- 两端共用的面板样式与外壳（与 Linux 版同一份字节，见 mybot2/tests/test_dual_end_assets.py） -->
<link rel="stylesheet" href="panel.css">
<link rel="stylesheet" href="cfg_form.css">
</head>
<body>
<!-- 登录闸门（仅在需要鉴权时显示）：进程内桌面模式不受影响 -->
<div id="loginGate" class="ui-modal" hidden>
  <div class="ui-modal-backdrop"></div>
  <div class="ui-modal-box">
    <h2 class="ui-modal-title">需要登录</h2>
    <div class="ui-modal-msg" id="gateHint">请输入访问密码</div>
    <div class="cf-field" style="margin-top:10px">
      <input type="password" id="gatePwd" autocomplete="current-password" placeholder="密码 / 令牌">
    </div>
    <div class="ui-modal-actions">
      <button class="btn btn-primary" id="gateBtn">登录</button>
    </div>
  </div>
</div>
<script src="cfg_form.js"></script>
<script src="panel.js"></script>
<script>
/* ==========================================================================
   Windows 桌面面板（栖星 AsterCore）：与 Linux 面板**同一套界面**。
   这里只声明"接口在哪 / 显示哪些页 / 少数桌面端特有行为"，界面代码全在 panel.js。

   本文件特有（Linux 面板不需要）的是**传输层**：桌面窗口加载的是本地文件
   （file://），窗口里的请求走 js_api 进程内 RPC，而不是 HTTP。
   ========================================================================== */

/* 本地存储：桌面窗口走 file://，Chromium 系在该协议下可能禁用 localStorage ——
   直接访问会让**整段脚本死掉**（面板白屏）。所以套一层带内存兜底的 store。*/
const store = (() => {
  try {
    localStorage.setItem('__ac_probe', '1'); localStorage.removeItem('__ac_probe');
    return localStorage;
  } catch (e) {
    const mem = {};
    return { getItem: k => (k in mem ? mem[k] : null),
             setItem: (k, v) => { mem[k] = String(v); },
             removeItem: k => { delete mem[k]; } };
  }
})();
let authToken = store.getItem('ac_token') || '';

/* 传输层（施工手册 §1.5：运行时自动选择，同一份前端两边都能跑）
   桌面壳：window.pywebview.api.rpc —— 进程内调用，零端口零鉴权
   浏览器：HTTP /api/*（开着 Web 服务时）
   关键点：**必须等 pywebviewready**，直接读 window.pywebview 是 undefined。*/
const Transport = (() => {
  let mode = 'http';
  const hasJs = () => !!(window.pywebview && window.pywebview.api && window.pywebview.api.rpc);

  async function detect() {
    if (hasJs()) { mode = 'jsapi'; return mode; }
    if (location.protocol !== 'file:') { mode = 'http'; return mode; }
    // 桌面壳（本地文件）→ 等注入，最多 3 秒，超时按 HTTP 兜底
    const ok = await new Promise(res => {
      const done = v => { clearTimeout(t); clearInterval(iv); res(v); };
      const t = setTimeout(() => done(false), 3000);
      const iv = setInterval(() => { if (hasJs()) done(true); }, 50);
      window.addEventListener('pywebviewready', () => done(true), { once: true });
    });
    mode = ok ? 'jsapi' : 'http';
    return mode;
  }

  async function call(u, o) {
    const o2 = o || {};
    if (mode !== 'jsapi') {
      const r = await fetch(u, o2);
      let jd; try { jd = await r.json(); } catch (e) { jd = { ok: false, error: 'bad resp' }; }
      return jd;
    }
    let body;
    if (o2.body) { try { body = JSON.parse(o2.body); } catch (e) { body = o2.body; } }
    return await window.pywebview.api.rpc(u, { method: o2.method || 'GET', body: body });
  }

  /* fetch 兜底垫片：桌面模式下把同源/相对 URL 的请求转成 js_api。
     这样既有 fetch 调用点一行都不用改，**将来新加的前端代码也自动走对通道**。*/
  function installFetchShim() {
    if (mode !== 'jsapi' || window.__acShim) return;
    window.__acShim = true;
    const orig = window.fetch.bind(window);
    window.fetch = async (u, o) => {
      const url = typeof u === 'string' ? u : ((u && u.url) || '');
      const sameOrigin = !/^[a-z]+:\/\//i.test(url);
      if (sameOrigin) {
        const jd = await call(url, o);
        return { ok: true, status: 200, json: async () => jd, text: async () => JSON.stringify(jd) };
      }
      return orig(u, o);
    };
  }

  return { detect, call, installFetchShim, get mode() { return mode; } };
})();

/* 桌面端与页面胶水的唯一 HTTP 入口：带 Bearer（token 模式）+ 走 Transport */
const j = function (url, opts) {
  opts = opts || {};
  const h = opts.headers || {};
  if (authToken) h['Authorization'] = 'Bearer ' + authToken;
  opts.headers = h;
  return fetch(url, opts).then(function (r) { return r.json(); });
};
const post = function (url, body) {
  return j(url, {
    method: 'POST',
    headers: body === undefined ? {} : { 'Content-Type': 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body)
  });
};
let AID = new URLSearchParams(location.search).get('aid') || '';   // 当前账号
let ACCTS = [], PLUGINS = {};

/* 页面 → 是否需要"当前账号" */
const PER_ACCOUNT = { dashboard: 1, config: 1, logs: 1 };
function acctUrl(suffix) { return '/api/accounts/' + encodeURIComponent(AID) + suffix; }
function pageUrl(page) {
  let url = '/ui/page/' + page;
  const q = [];
  if (PER_ACCOUNT[page] && AID) q.push('aid=' + encodeURIComponent(AID));
  if (page === 'config' && PANEL.key) q.push('plugin=' + encodeURIComponent(PANEL.key));
  return url + (q.length ? '?' + q.join('&') : '');
}

PANEL.endpoints = {
  page: pageUrl,
  headerStatus: function () { return AID ? acctUrl('/status') : null; },
  status: function () { return '/ui/status' + (AID ? '?aid=' + encodeURIComponent(AID) : ''); },
  plugins: function () { return AID ? acctUrl('/plugins') : null; },
  schema: function (k) { return acctUrl('/plugins/' + encodeURIComponent(k) + '/schema'); },
  saveConfig: function (k, cfg, raw) {
    return post(acctUrl('/plugins/' + encodeURIComponent(k) + '/config') + (raw ? '?raw=1' : ''), cfg);
  },
  logs: function (sfx, lines) { return acctUrl('/logs?limit=' + lines); },
  headerButtons: null
};

/* 与 Linux 端同一套导航；桌面端多「账号」「运行方式」「安全设置」 */
PANEL.nav = [
  { id: 'dashboard', icon: '📊', label: '概览', group: '概览' },
  { id: 'accounts', icon: '👥', label: '账号', group: '管理', sub: true },
  { id: 'config', icon: '⚙️', label: '插件配置', group: '管理', sub: true },
  { id: 'logs', icon: '📋', label: '运行日志', group: '管理' },
  { id: 'guide-page', icon: '🚀', label: '连接引导', group: '管理' },
  { id: 'settings', icon: '⚙️', label: '设置', group: '设置' },
  { id: 'about-page', icon: '🔄', label: '关于与更新', group: '设置' }
];

/* 账号列表（侧边栏二级菜单 + 账号页共用） */
async function loadAccounts() {
  const d = await j('/api/accounts');
  ACCTS = (d && d.data) || [];
  if (!AID && ACCTS.length) AID = ACCTS.find(function (a) { return a.running; })?.account_id || ACCTS[0].account_id;
  return ACCTS;
}
function renderAccountMenu(sub) {
  if (!ACCTS.length) { sub.innerHTML = '<div class="nav-sub-loading">还没有账号</div>'; return; }
  sub.innerHTML = ACCTS.map(function (a) {
    const active = a.account_id === AID;
    return '<div class="acct-row ' + (active ? 'active' : '') + '" role="button" tabindex="0"'
      + ' data-acct-pick="' + PANEL.esc(a.account_id) + '">'
      + '<span class="status-dot ' + (a.running ? 'green' : 'red') + '"></span>'
      + '<span class="min-w-0" style="min-width:0;flex:1"><span class="a-name">' + PANEL.esc(a.display_name || a.account_id)
      + '</span><div class="a-sub">ID ' + PANEL.esc(a.account_id) + ' · ' + PANEL.esc(a.backend_name || '') + '</div></span></div>';
  }).join('');
}
function renderPluginMenu(sub) {
  const keys = Object.keys(PLUGINS);
  if (!AID) { sub.innerHTML = '<div class="nav-sub-loading">先选一个账号</div>'; return; }
  if (!keys.length) { sub.innerHTML = '<div class="nav-sub-loading">账号未运行或没有插件</div>'; return; }
  sub.innerHTML = keys.map(function (k) {
    const p = PLUGINS[k], active = PANEL.key === k && PANEL.page === 'config';
    return '<div class="nav-sub-item ' + (active ? 'active' : '') + '" role="button" tabindex="0"'
      + (active ? ' aria-current="page"' : '') + ' data-open="config" data-key="' + PANEL.esc(k) + '">'
      + PANEL.esc(p.display || k) + (p.enabled === false ? ' <span class="el-tag warning">停用</span>' : '')
      + (PANEL.dirty[k] ? '<span class="unsaved-dot" title="有未保存的修改"></span>' : '') + '</div>';
  }).join('');
}
async function loadPlugins() {
  if (!AID) { PLUGINS = {}; return; }
  try {
    const d = await j(acctUrl('/plugins'));
    const items = (d && d.data) || [];
    PLUGINS = {};
    items.forEach(function (it) { PLUGINS[it.name] = it; });
  } catch (e) { PLUGINS = {}; }
  const sub = PANEL.$('sub_config');
  if (sub) renderPluginMenu(sub);
}

/* 账号切换：保持当前页，只换上下文 */
async function pickAccount(aid) {
  AID = aid;
  PANEL.subOpen.accounts = true;
  await loadPlugins();
  const a = ACCTS.find(function (x) { return x.account_id === aid; }) || {};
  PANEL.$('botName').textContent = a.display_name || aid;
  PANEL.$('botSub').textContent = 'ID ' + aid + ' · ' + (a.backend_name || '');
  PANEL.hooks.groupCache = null;
  await PANEL.renderPage();
  if (PANEL.page === 'config' && !PANEL.key && Object.keys(PLUGINS).length) {
    PANEL.key = Object.keys(PLUGINS)[0];
    await PANEL.renderPage();
  }
}

/* 表单取值：把 data-acct / data-rt / data-auth 标注的控件收成一个对象 */
function collectForm(attr) {
  const out = {};
  document.querySelectorAll('[data-' + attr + ']').forEach(function (el) {
    out[el.getAttribute('data-' + attr)] = el.type === 'checkbox' ? el.checked : el.value;
  });
  return out;
}
function formMsg(id, text, bad) {
  const el = PANEL.$(id);
  if (!el) return;
  el.textContent = text || '';
  el.style.color = bad ? 'var(--color-danger)' : 'var(--text-secondary)';
}

PANEL.hooks = {
  /* 传输通道：桌面模式走进程内 RPC（file://），浏览器模式走 HTTP —— 都在共用外壳之外 */
  beforeStart: async function () {
    try {
      await Transport.detect();
      Transport.installFetchShim();
    } catch (e) { /* 兜底走 HTTP */ }
    /* 鉴权闸门：需要登录就先登录，否则面板接口全是 401 */
    const a = await j('/api/auth/status');
    const st = (a && a.data) || {};
    const isToken = st.mode === 'token';
    if (st.need) {
      const gate = PANEL.$('loginGate');
      gate.hidden = false;
      PANEL.$('gateHint').textContent = isToken ? '请输入访问令牌' : '请输入访问密码';
      const btn = PANEL.$('gateBtn'), pwd = PANEL.$('gatePwd');
      const doLogin = async function () {
        const r = await post('/api/login', isToken ? { token: pwd.value } : { password: pwd.value });
        if (r && r.ok) {
          /* token 模式：before_request 只认请求头，不认 session —— 必须记住令牌 */
          if (isToken) { store.setItem('ac_token', pwd.value); authToken = pwd.value; }
          gate.hidden = true; location.reload();
        }
        else PANEL.$('gateHint').textContent = (r && r.error) || '登录失败';
      };
      btn.onclick = doLogin;
      pwd.addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
      pwd.focus();
      await new Promise(function () { });      // 等用户登录（登录成功后整页刷新）
    }
  },
  identity: async function () {
    const d = await j('/api/info');
    const i = (d && d.data) || {};
    const ver = PANEL.$('headerExtraSlot');
    if (ver) {
      ver.innerHTML = '<span class="el-tag muted">v' + PANEL.esc(i.version || '') + '</span>'
        + '<span class="el-tag muted" id="transportTag" title="前端 ↔ 内核的通信通道">'
        + PANEL.esc(Transport.mode === 'jsapi' ? '桌面模式 · 进程内 RPC' : '浏览器模式 · HTTP') + '</span>';
    }
    await loadAccounts();
    if (!AID && ACCTS.length) AID = ACCTS[0].account_id;
    const a = ACCTS.find(function (x) { return x.account_id === AID; }) || {};
    PANEL.$('botName').textContent = a.display_name || AID || '栖星 AsterCore';
    PANEL.$('botSub').textContent = AID ? ('ID ' + AID + ' · ' + (a.backend_name || '')) : '还没有账号';
    document.title = (a.display_name || 'AsterCore') + ' - 管理面板';
    await loadPlugins();
  },
  logout: function () { post('/api/logout').then(function () { location.reload(); }); },
  subMenus: {
    accounts: function (sub) { renderAccountMenu(sub); },
    config: function (sub) { renderPluginMenu(sub); loadPlugins(); }
  },
  mounted: {
    dashboard: function () { PANEL.startPoll(PANEL.refreshStatusParts, 10000); },
    logs: function () {
      PANEL.syncLogState('');
      PANEL.loadLogs('');
      if (PANEL.logState('').auto) PANEL.startPoll(function () { PANEL.loadLogs(''); }, 5000);
    },
    config: function () { PANEL.renderConfigForm(PANEL.key); }
  },
  /* 日志接口返回结构化条目，这里转成共用查看器认识的文本行 */
  fetchLogs: async function (sfx, lines) {
    const d = await j(acctUrl('/logs?limit=' + lines));
    const items = (d && d.data && d.data.logs) || [];
    const text = items.map(function (e) {
      const t = new Date((e.ts || 0) * 1000);
      const p = function (n) { return String(n).padStart(2, '0'); };
      const ts = p(t.getMonth() + 1) + '-' + p(t.getDate()) + ' ' + p(t.getHours()) + ':' + p(t.getMinutes()) + ':' + p(t.getSeconds());
      return ts + ' [' + (e.level || 'info') + '] ' + (e.source ? e.source + ' | ' : '') + (e.msg || '');
    }).join('\n');
    return { log: text || '暂无日志', total: items.length };
  },
  save: {
    config: function (btn) { PANEL.saveConfig(btn, false); },
    'settings-runtime': async function (btn) {
      await PANEL.runBusy(btn, '保存中…', async function () {
        const r = await post('/api/settings/runtime', collectForm('rt'));
        if (r && r.ok) { PANEL.toast('运行方式已保存', 'success'); PANEL.renderPage(); }
        else formMsg('rtMsg', (r && r.error) || '保存失败', true);
      });
    },
    'settings-auth': async function (btn) {
      await PANEL.runBusy(btn, '保存中…', async function () {
        const d = collectForm('auth');
        const r = await post('/api/settings/auth', d);
        if (r && r.ok) { PANEL.toast('安全设置已保存', 'success'); PANEL.renderPage(); }
        else formMsg('auMsg', (r && r.error) || '保存失败', true);
      });
    },
    'settings-page': async function (btn) {
      await PANEL.runBusy(btn, '保存中…', async function () {
        const mode = document.getElementById('sp_mode');
        const port = document.getElementById('sp_port');
        const r = await post('/api/setup/page', {
          page_mode: mode ? mode.value : 'window',
          port: port ? port.value : ''
        });
        if (r && r.ok) {
          PANEL.toast('页面设置已保存' + (r.data && r.data.restart_needed ? '（重启后生效）' : ''), 'success');
          PANEL.renderPage();
        } else formMsg('spMsg', (r && r.error) || '保存失败', true);
      });
    }
  },
  saveRestart: function (btn) { PANEL.saveConfig(btn, true); },
  restart: async function () {
    if (!AID) return { ok: false, error: '没有当前账号' };
    await post(acctUrl('/stop'));
    return post(acctUrl('/start'));
  },
  loadGroups: async function (force) {
    if (!AID) return [];
    if (PANEL.hooks.groupCache && !force) return PANEL.hooks.groupCache;
    try {
      const d = await j(acctUrl('/groups'));
      const list = (d && d.data) || [];
      PANEL.hooks.groupCache = list.map(function (g) {
        return { group_id: g.group_id || g.id, group_name: g.group_name || g.name || '' };
      });
      PANEL.hooks.groupErr = '';
    } catch (e) { PANEL.hooks.groupCache = []; PANEL.hooks.groupErr = (e.message || '接口不可用'); }
    if (force) {
      await PANEL.renderConfigForm(PANEL.key);
      PANEL.toast('已刷新群列表（' + (PANEL.hooks.groupCache || []).length + ' 个）', 'success');
    }
    return PANEL.hooks.groupCache;
  },
  groupSelect: function () { return { groups: PANEL.hooks.groupCache || [], error: PANEL.hooks.groupErr || '' }; },
  actions: {
    'acct-add': function () {
      PANEL.hooks._editing = null;
      const put = function (id, v) { const el = document.getElementById(id); if (el) { el.value = v; } };
      put('ac_id', ''); put('ac_name', '');
      put('ac_ws', 'ws://127.0.0.1:3001'); put('ac_http', 'http://127.0.0.1:3000'); put('ac_token', '');
      const idEl = document.getElementById('ac_id');
      if (idEl) { idEl.readOnly = false; }
      const ttl = document.getElementById('acctDlgTitle');
      if (ttl) { ttl.textContent = '添加账号'; }
      const dlg = document.getElementById('acctDlg');
      if (dlg) { dlg.hidden = false; }
      if (idEl) { idEl.focus(); }
      return { ok: true, message: '填写账号信息后点「保存」' };
    },
    'acct-edit': function (el) {
      const aid = el.getAttribute('data-key') || '';
      PANEL.hooks._editing = aid;
      const put = function (id, v) { const x = document.getElementById(id); if (x) { x.value = v; } };
      put('ac_id', aid);
      put('ac_name', el.getAttribute('data-name') || '');
      put('ac_ws', el.getAttribute('data-ws') || 'ws://127.0.0.1:3001');
      put('ac_http', el.getAttribute('data-http') || 'http://127.0.0.1:3000');
      put('ac_token', el.getAttribute('data-token') || '');
      const idEl = document.getElementById('ac_id');
      if (idEl) { idEl.readOnly = true; }        /* 编辑时不让改 ID（它是目录名） */
      const ttl = document.getElementById('acctDlgTitle');
      if (ttl) { ttl.textContent = '编辑账号 ' + aid; }
      const dlg = document.getElementById('acctDlg');
      if (dlg) { dlg.hidden = false; }
      return { ok: true, message: '已载入账号 ' + aid };
    },
    'acct-dlg-cancel': function () {
      const dlg = document.getElementById('acctDlg');
      if (dlg) { dlg.hidden = true; }
      PANEL.hooks._editing = null;
      return { ok: true, message: '已取消' };
    },
    'save-rt': async function (btn) {
      await PANEL.runBusy(btn, '保存中…', async function () {
        const r = await post('/api/settings/runtime', collectForm('rt'));
        formMsg('svrtMsg', (r && r.ok) ? '后端模式已保存' : ((r && r.error) || '保存失败'), !(r && r.ok));
      });
      return { ok: true, message: '后端模式已保存' };
    },
    'save-auth': async function (btn) {
      await PANEL.runBusy(btn, '保存中…', async function () {
        const r = await post('/api/settings/auth', collectForm('auth'));
        formMsg('svauthMsg', (r && r.ok) ? '安全设置已保存' : ((r && r.error) || '保存失败'), !(r && r.ok));
      });
      return { ok: true, message: '安全设置已保存' };
    },
    'save-page': async function (btn) {
      await PANEL.runBusy(btn, '保存中…', async function () {
        const m = document.getElementById('sp_mode');
        const pr = document.getElementById('sp_port');
        const r = await post('/api/setup/page', { page_mode: m ? m.value : 'window',
                                                  port: pr ? pr.value : '' });
        formMsg('svpageMsg', (r && r.ok)
          ? ('页面设置已保存' + (r.data && r.data.restart_needed ? '（重启后生效）' : ''))
          : ((r && r.error) || '保存失败'), !(r && r.ok));
      });
      return { ok: true, message: '页面设置已保存' };
    },
    'rt-pick': function (el) {
      /* 单选按钮：把选中的值同步给隐藏输入（保存仍走 collectForm('rt') 的 data-rt 约定） */
      const v = el.getAttribute('value') || '';
      const hid = document.getElementById('rt_mode');
      if (hid) { hid.value = v; }
      const lbl = el.parentNode ? (el.parentNode.textContent || '').trim().split('\n')[0] : v;
      return { ok: true, message: '已选择：' + (lbl || v) + '（点右下角「保存」生效）' };
    },
    'up-refresh': async function () {
      const r = await post('/api/app/update/status', {});
      const d = (r && r.ok && r.data) ? r.data : {};
      const box = document.getElementById('upBox');
      if (box) { box.textContent = '版本 ' + (d.version || '—') + ' ｜ 状态 ' + (d.state || '?')
        + ' ｜ ' + (d.message || '') + (d.error ? ' ｜ 错误：' + d.error : ''); }
      const fill = document.getElementById('upBarFill');
      if (fill) { fill.style.width = (d.percent || 0) + '%'; }
      return { ok: true, message: d.message || '状态已刷新' };
    },
    'up-check': async function () {
      const r = await post('/api/app/update/check', {});
      const d = (r && r.ok && r.data) ? r.data : {};
      if (d.available) { PANEL.toast('发现新版本 ' + d.version, 'success'); }
      PANEL.renderPage();
      return { ok: true, message: d.message || (d.available ? '发现新版本 ' + d.version : '已是最新版本') };
    },
    'up-start': async function () {
      await post('/api/app/update/start', {});
      /* 下载进度靠轮询（只在本页停留期间跑，切页后由 renderPage 清掉） */
      if (window.__upTimer) { clearInterval(window.__upTimer); }
      window.__upTimer = setInterval(async function () {
        const r = await post('/api/app/update/status', {});
        const d = (r && r.ok && r.data) ? r.data : {};
        const fill = document.getElementById('upBarFill');
        const box = document.getElementById('upBox');
        if (fill) { fill.style.width = (d.percent || 0) + '%'; }
        if (box) { box.textContent = '版本 ' + (d.version || '—') + ' ｜ 状态 ' + (d.state || '?')
          + ' ｜ ' + (d.message || '') + (d.error ? ' ｜ 错误：' + d.error : ''); }
        if (d.state === 'done' || d.state === 'error' || d.state === 'idle') {
          clearInterval(window.__upTimer); window.__upTimer = null;
          if (d.state === 'done') { PANEL.renderPage(); }
        }
      }, 1200);
      return { ok: true, message: '正在下载并校验…' };
    },
    'up-apply': async function () {
      const r = await post('/api/app/update/apply', {});
      if (!r || !r.ok) { return { ok: false, message: (r && r.error) || '应用更新失败' }; }
      return { ok: true, message: '程序将退出以应用更新，稍后会自动重新打开' };
    },
    'gd-prefill': async function () {
      /* 手动建号场景：把引导生成的 ws/令牌存起来，切到账号页后填进表单 */
      const d = window.__gdCfg || {};
      if (!d.ws_url && !d.access_token) {
        return { ok: false, message: '还没有配置信息，先走第②步「写配置」' };
      }
      /* 必须走 store（file:// 下 localStorage 可能被禁用，裸用会让整段脚本死掉） */
      store.setItem('prefill', JSON.stringify({
        ws_url: d.ws_url || '', http_url: d.http_url || '', access_token: d.access_token || ''
      }));
      const nav = document.querySelector('.nav-item[data-page="accounts"]');
      if (nav) { nav.click(); }
      let tries = 0;
      const timer = setInterval(function () {
        tries += 1;
        let pf = null;
        try { pf = JSON.parse(store.getItem('prefill') || 'null'); } catch (e) { pf = null; }
        const put = function (id, v) { const el = document.getElementById(id); if (el && v) { el.value = v; } };
        if (pf) { put('ac_ws', pf.ws_url); put('ac_http', pf.http_url); put('ac_token', pf.access_token); }
        if (tries > 12 || (pf && document.getElementById('ac_ws'))) { clearInterval(timer); }
      }, 250);
      return { ok: true, message: '已填入账号表单（填个 QQ 号再点保存即可）' };
    },
    'gd-create': async function (el) {
      const qq = document.getElementById('gdQQ');
      const aid = qq ? (qq.value || '').trim() : '';
      if (!aid) { return { ok: false, message: '先填 QQ 号' }; }
      const key = el.getAttribute('data-key') || 'napcat';
      const r = await post('/api/guide/account', { account_id: aid, key: key, start: true });
      if (!r || !r.ok) {
        const msg = (r && (r.error || (r.data && r.data.error))) || '建账号失败';
        formMsg('gdOut', msg, true);
        return { ok: false, message: msg };
      }
      const d = r.data || {};
      formMsg('gdOut', '已建好 ' + aid + (d.started ? ' 并已启动' : ('（未启动：' + (d.start_error || '') + '）')));
      PANEL.renderPage();
      return { ok: true, message: '账号 ' + aid + ' 已建好' + (d.started ? '并启动' : '') };
    },
    'gd-refresh': async function () {
      const r = await post('/api/guide/status', {});
      const box = document.getElementById('gdOut');
      if (box) { box.textContent = (r && r.ok) ? '状态已刷新（重新打开本页可看到最新安装/运行态）' : ((r && r.error) || '刷新失败'); }
      if (r && r.ok) { PANEL.renderPage(); }
      return { ok: true, message: (r && r.ok) ? '状态已刷新' : ((r && r.error) || '刷新失败') };
    },
    'gd-open': async function (el) {
      const url = el.getAttribute('data-url') || '';
      const r = await post('/api/app/open-url', { url: url });
      if (!r || !r.ok) {
        try { window.open(url, '_blank'); } catch (e) { /* 兜底失败就只提示 */ }
        return { ok: true, message: '已尝试用浏览器打开：' + url };
      }
      return { ok: true, message: '已在浏览器打开下载页，装好后回来点第②步' };
    },
    'gd-install': async function (el) {
      const key = el.getAttribute('data-key') || 'lagrange';
      const r = await post('/api/guide/install', { key: key });
      formMsg('gdOut', (r && r.ok) ? '已开始后台下载安装，进度看「看日志」' : ((r && r.error) || '安装失败'), !(r && r.ok));
      return { ok: !!(r && r.ok), message: (r && r.ok) ? '已开始后台下载安装' : ((r && r.error) || '安装失败') };
    },
    'gd-config': async function (el) {
      const key = el.getAttribute('data-key') || 'lagrange';
      const r = await post('/api/guide/config', { key: key });
      if (!r || !r.ok) { formMsg('gdOut', (r && r.error) || '写配置失败', true); return; }
      const d = r.data || {};
      window.__gdCfg = d;                      /* 记住这份连接信息，供"填入账号表单"用 */
      const box = document.getElementById('gdCfg');
      if (box) {
        box.style.display = 'block';
        box.innerHTML = '<div class="cf-field"><label class="cf-label">把这串填到账号表单</label>'
          + '<input type="text" readonly value="' + PANEL.esc(d.ws_url || '') + '">'
          + '<input type="text" readonly value="' + PANEL.esc(d.access_token || '') + '" style="margin-top:6px">'
          + '<div class="cf-help">ws 地址 + 令牌；配置文件：' + PANEL.esc(d.path || '') + '</div>'
          + '<button class="btn btn-default" data-act="gd-prefill" style="margin-top:8px">'
          + '把这份连接信息填入账号表单（手动建号用）</button></div>';
      }
      formMsg('gdOut', '配置已写入（端口与令牌已自动生成）');
      return { ok: true, message: '配置已写入' };
    },
    'gd-host': async function (el) {
      const key = el.getAttribute('data-key') || 'lagrange';
      const r = await post('/api/guide/host', { key: key });
      if (!r || !r.ok) { formMsg('gdOut', (r && r.error) || '启动失败', true); return; }
      const d = r.data || {};
      formMsg('gdOut', d.ok ? ('组件已启动' + (d.msg ? '：' + d.msg : '')) : ('启动失败：' + (d.msg || '')));
      const qr = d.qr || {};
      const box = document.getElementById('gdQR');
      if (box && qr.data_url) { box.innerHTML = '<img alt="二维码" src="' + qr.data_url + '" style="width:220px">'; }
      return { ok: !!d.ok, message: d.ok ? '组件已启动' : ('启动失败：' + (d.msg || '')) };
    },
    'gd-stop': async function (el) {
      const key = el.getAttribute('data-key') || 'lagrange';
      const r = await post('/api/guide/stop', { key: key });
      formMsg('gdOut', (r && r.ok) ? '组件已停止' : ((r && r.error) || '停止失败'), !(r && r.ok));
      return { ok: !!(r && r.ok), message: (r && r.ok) ? '组件已停止' : ((r && r.error) || '停止失败') };
    },
    'gd-log': async function (el) {
      const key = el.getAttribute('data-key') || 'lagrange';
      const r = await post('/api/guide/log', { key: key, limit: 60 });
      const box = document.getElementById('gdLogBox');
      if (box) { box.style.display = 'block'; box.textContent = (r && r.ok) ? (((r.data || {}).lines || []).join('\n') || '暂无日志') : ((r && r.error) || '取日志失败'); }
      return { ok: !!(r && r.ok), message: (r && r.ok) ? '日志已更新' : ((r && r.error) || '取日志失败') };
    },
    start: async function (el) { return post(acctUrl('/start'), undefined); },
    stop: async function (el) { return post(acctUrl('/stop'), undefined); },
    'reload-plugins': async function (el) { return post(acctUrl('/plugins/reload')); },
    'create-account': async function (el) {
      const f = collectForm('acct');
      if (!f.account_id) { formMsg('acMsg', '账号 ID 必填', true); return { ok: false, error: '账号 ID 必填' }; }
      const r = await post('/api/accounts', {
        account_id: f.account_id, display_name: f.display_name || f.account_id,
        backend: { ws_url: f.ws_url, http_url: f.http_url, access_token: f.access_token }
      });
      if (r && r.ok) { AID = f.account_id; await loadAccounts(); await loadPlugins(); PANEL.toast('账号已创建', 'success'); PANEL.renderPage(); }
      else formMsg('acMsg', (r && r.error) || '创建失败', true);
      return r || { ok: false };
    },
    'edit-account': async function (el) {
      const aid = el.getAttribute('data-key');
      const d = await j('/api/accounts/' + encodeURIComponent(aid));
      PANEL.hooks._editing = aid;
      const cfg = (d && d.data) || {};
      /* 编辑态由后端片段渲染（表单里填好现值），这里只切页 */
      await PANEL.goPage('accounts');
      return { ok: true, message: '已载入账号 ' + aid };
    },
    'save-account': async function (el) {
      const f = collectForm('acct');
      const r = await post('/api/accounts/' + encodeURIComponent(f.account_id) + '/update', {
        display_name: f.display_name, backend: { ws_url: f.ws_url, http_url: f.http_url, access_token: f.access_token }
      });
      if (r && r.ok) { PANEL.hooks._editing = null; await loadAccounts(); PANEL.toast('账号已保存', 'success'); PANEL.renderPage(); }
      else formMsg('acMsg', (r && r.error) || '保存失败', true);
      return r || { ok: false };
    },
    'cancel-edit': async function () { PANEL.hooks._editing = null; await PANEL.renderPage(); return { ok: true, message: '已取消' }; },
    'del-account': async function (el) {
      const aid = el.getAttribute('data-key');
      const r = await post('/api/accounts/' + encodeURIComponent(aid) + '/delete');
      if (r && r.ok) { if (AID === aid) AID = ''; await loadAccounts(); await loadPlugins(); PANEL.toast('账号已删除', 'success'); PANEL.renderPage(); }
      return r || { ok: false };
    },
    'reset-wizard': async function () {
      const r = await post('/api/settings/runtime', { action: 'reset_wizard' });
      if (r && r.ok) PANEL.toast('已重置向导状态', 'success');
      return r || { ok: false };
    },
    'rotate-token': async function () {
      const r = await post('/api/settings/auth', { rotate_token: true });
      if (r && r.ok) { PANEL.toast('已重新生成令牌', 'success'); PANEL.renderPage(); }
      return r || { ok: false };
    }
  }
};
/* 账号切换：侧栏与账号页里点 [data-acct-pick] 都走共用外壳的委托 → 进来这里 */
PANEL.hooks.pickAccount = pickAccount;

/* 编辑账号时把 aid 带进片段请求（唯一一处拼 edit=，避免重复参数） */
PANEL._origPageUrl = PANEL.endpoints.page;
PANEL.endpoints.page = function (p) {
  let url = PANEL._origPageUrl(p);
  if (p === 'accounts' && PANEL.hooks._editing) {
    url += (url.indexOf('?') < 0 ? '?' : '&') + 'edit=' + encodeURIComponent(PANEL.hooks._editing);
  }
  return url;
};

PANEL.start();

/* 深链：/?page=settings-page —— 启动后点一下对应导航项（复用面板自己的路由） */
try {
  var _deepPage = new URLSearchParams(location.search).get('page');
  if (_deepPage) {
    setTimeout(function () {
      var _el = document.querySelector('.nav-item[data-page="' + _deepPage + '"]');
      if (_el) { _el.click(); }
    }, 400);
  }
} catch (e) { }
</script>
<!-- 桌面端顶栏 + 账号浮层（能力探测：Linux 端无 /api/app/* 时自动隐藏，见 panel.js） -->
<div id="desktopBar" style="display:none">
  <button id="dbAvatar" class="db-avatar" title="账号列表">·</button>
  <div class="db-info"><div id="dbNick" class="db-nick">—</div><div id="dbState" class="db-state">—</div></div>
  <button id="dbToggle" class="db-btn">启动机器人</button>
  <button id="dbRestart" class="db-btn ghost">重启机器人</button>
  <button id="dbSettings" class="db-btn ghost">设置</button>
  <button id="dbExit" class="db-btn ghost">退出</button>
</div>
<div id="acctOverlay" style="display:none">
  <div class="acct-panel"><div class="acct-title">账号</div><div class="acct-list"></div></div>
</div>
</body>
</html>
