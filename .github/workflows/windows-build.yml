# 栖星 AsterCore · Windows 构建（GitHub Actions）
# 触发：push 打 v* 标签 或 手动（workflow_dispatch）
# 产物：dist/AsterCore-win64-<ver>.zip（主程序 onedir，不含 accounts/data）

name: windows-build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Release 需要写权限（默认可能是只读）；artifact 之外的公开下载靠它
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      # Windows runner 控制台是 cp1252：脚本里打印中文会 UnicodeEncodeError。
      # 构建脚本自己也做了 stdio reconfigure，这里是双保险（也覆盖子进程）。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # parser = 视频解析依赖链（36 个包，全有 Windows 轮子、零编译）。
          # 注意 qrcode-terminal 只有 sdist（纯 Python），所以这里不能用 --only-binary=:all:。
          pip install -e ".[web,desktop,parser]"
          pip install pyinstaller

      - name: Fetch ffmpeg (Windows)
        run: |
          # 随包分发 ffmpeg.exe，落到 <repo>/tools/ffmpeg/bin/，spec 会收进
          # <exe 同级>/tools/ffmpeg/bin/，bootstrap.find_ffmpeg() 会自动认
          python tools/fetch_ffmpeg.py

      - name: Build exe (onedir)
        run: |
          python -m PyInstaller pack/astercore.spec --noconfirm --clean

      - name: Add docs to package
        shell: pwsh
        run: |
          # 使用说明与 README 放在 exe 同级，用户解压即可看到
          Copy-Item "pack/使用说明.txt" "dist/astercore/使用说明.txt" -Force
          if (Test-Path "README.md") { Copy-Item "README.md" "dist/astercore/README.md" -Force }
          # .NET Framework 运行时配置必须与 exe 同级（PyInstaller 的 datas 只会进 _internal，
          # 而 .NET 只认 <exe 名>.config）。缺了它 → pythonnet 的 LoadFrom 被判"网络位置"
          # 拒绝（0x80131515）→ 内嵌窗口静默退化成开浏览器、托盘不建。
          Copy-Item "pack/astercore.exe.config" "dist/astercore/astercore.exe.config" -Force
          if (-not (Test-Path "dist/astercore/astercore.exe.config")) {
            throw "astercore.exe.config 没进包：内嵌窗口会静默失效"
          }

      - name: Package zip
        shell: pwsh
        run: |
          $ver = if ("$env:GITHUB_REF_NAME" -match "^v") { "$env:GITHUB_REF_NAME" } else { "dev" }
          $zip = "AsterCore-win64-$ver.zip"
          Compress-Archive -Path dist/astercore/* -DestinationPath $zip -Force
          echo "ZIP_NAME=$zip" >> $env:GITHUB_ENV
          Write-Host "打包完成: $zip ($([math]::Round((Get-Item $zip).Length/1MB,1)) MB)"

      - uses: actions/upload-artifact@v4
        with:
          name: AsterCore-win64
          path: AsterCore-win64-*.zip
          if-no-files-found: error

      # 同步发一个**公开 Release**：Actions 的 artifact 必须登录+token 才能下载，
      # 而本机发布密钥是只读 deploy key（拿不到 artifact），用户也不该为此登录。
      - name: Publish release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AsterCore-win64-*.zip
          generate_release_notes: true
