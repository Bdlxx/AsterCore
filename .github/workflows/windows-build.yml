# 栖星 AsterCore · Windows 构建（GitHub Actions）
# 触发：push 打 v* 标签 或 手动（workflow_dispatch）
# 产物：dist/AsterCore-win64-<ver>.zip（主程序 onedir，不含 accounts/data）

name: windows-build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Release 需要写权限（默认可能是只读）；artifact 之外的公开下载靠它
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      # Windows runner 控制台是 cp1252：脚本里打印中文会 UnicodeEncodeError。
      # 构建脚本自己也做了 stdio reconfigure，这里是双保险（也覆盖子进程）。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # parser = 视频解析依赖链（36 个包，全有 Windows 轮子、零编译）。
          # 注意 qrcode-terminal 只有 sdist（纯 Python），所以这里不能用 --only-binary=:all:。
          pip install -e ".[web,desktop,parser]"
          pip install pyinstaller

      # ---- 质量闸门：先跑测试，红了就不要浪费几分钟去打包 ----
      # 背景：本工作流原先装完依赖直接 PyInstaller，**从不跑测试** → 任何回归都能照样发版
      # （v0.6.25 就是没有测试背书发出去的）。这两步是补上的闸门。
      - name: Static panel check
        run: python tools/check_panel_static.py

      - name: Run tests
        # -t . 保证以仓库根为顶层（否则 tests 目录会被当成顶层、导入不到 astercore）
        env:
          # CI 装的是 [web,desktop,parser] → 解析依赖必须齐全，强制校验
          ASTERCORE_TEST_PARSER_DEPS: "1"
        run: python -m unittest discover -s tests -t .

      - name: Fetch ffmpeg (Windows)
        run: |
          # 随包分发 ffmpeg.exe，落到 <repo>/tools/ffmpeg/bin/，spec 会收进
          # <exe 同级>/tools/ffmpeg/bin/，bootstrap.find_ffmpeg() 会自动认
          python tools/fetch_ffmpeg.py

      - name: Fetch Lagrange (bundled)
        shell: pwsh
        run: |
          # 内置协议随包自带：解到 <repo>/pack/components/lagrange/，spec 收进 _internal/
          # 这样用户装好软件即可用「内部协议」，引导页不需要再下载它。
          $dst = "pack/components/lagrange"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $url = "https://github.com/LagrangeDev/Lagrange.Core/releases/download/nightly/Lagrange.OneBot_win-x64_net9.0_SelfContained.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP/lagrange.zip" -UseBasicParsing
          Expand-Archive -Path "$env:TEMP/lagrange.zip" -DestinationPath $dst -Force
          Get-ChildItem -Recurse $dst | Select-Object -First 8 FullName

      - name: Build exe (onedir)
        run: |
          python -m PyInstaller pack/astercore.spec --noconfirm --clean

      - name: Add docs to package
        shell: pwsh
        # 关于 docs：v0.6.26 的包里混进了 docs/Windows版开发计划书.md.bak-20261014-0038。
        # 真实根因是 **tag 打在"取消跟踪"之前**（CI 是干净 checkout，不可能有未跟踪文件），
        # 那个 .bak 现在既不在磁盘也没被跟踪。
        # 这里刻意**沿用原本能work的整目录复制**（run #46/#47 我改成 git ls-files 逐个复制，
        # 因无法在本机验证 git 的中文路径转义等行为而连续两次卡在这一步），
        # 另加一道**结构性守卫**：目标里一旦出现 .bak 立刻失败。
        run: |
          Copy-Item "pack/使用说明.txt" "dist/astercore/使用说明.txt" -Force
          if (Test-Path "docs") { Copy-Item "docs" "dist/astercore/docs" -Recurse -Force }
          $baks = @(Get-ChildItem "dist/astercore/docs" -Recurse -File -Filter "*.bak*" -ErrorAction SilentlyContinue)
          if ($baks.Length -gt 0) { throw "docs 里混进了备份文件：$($baks.Name -join ', ')" }
          if (-not (Test-Path "dist/astercore/docs")) { throw "docs 没进包" }
          Write-Host "docs 已复制（无 .bak）"
          if (Test-Path "docs/常见问题FAQ.md") { Copy-Item "docs/常见问题FAQ.md" "dist/astercore/常见问题FAQ.md" -Force }
          if (Test-Path "README.md") { Copy-Item "README.md" "dist/astercore/README.md" -Force }
          # .NET Framework 运行时配置必须与 exe 同级（PyInstaller 的 datas 只会进 _internal）
          if (Test-Path "pack/astercore.exe.config") { Copy-Item "pack/astercore.exe.config" "dist/astercore/astercore.exe.config" -Force }
          if (-not (Test-Path "dist/astercore/astercore.exe.config")) { throw "astercore.exe.config 没进包：内嵌窗口会静默失效" }

      - name: Package zip
        shell: pwsh
        run: |
          $ver = if ("$env:GITHUB_REF_NAME" -match "^v") { "$env:GITHUB_REF_NAME" } else { "dev" }
          $zip = "AsterCore-win64-$ver.zip"
          Compress-Archive -Path dist/astercore/* -DestinationPath $zip -Force
          echo "ZIP_NAME=$zip" >> $env:GITHUB_ENV
          Write-Host "打包完成: $zip ($([math]::Round((Get-Item $zip).Length/1MB,1)) MB)"

      - uses: actions/upload-artifact@v4
        with:
          name: AsterCore-win64
          path: AsterCore-win64-*.zip
          if-no-files-found: error

      # 同步发一个**公开 Release**：Actions 的 artifact 必须登录+token 才能下载，
      # 而本机发布密钥是只读 deploy key（拿不到 artifact），用户也不该为此登录。
      - name: Write checksums
        shell: pwsh
        run: |
          # 更新器要用 sha256 校验下载到的包：为每个 zip 生成 <zip>.sha256，随 Release 一起上传
          # 注意：zip 实际落在仓库根（见 Publish 的 files: AsterCore-win64-*.zip），
          # 所以两个可能的位置都扫一遍；找不到就报错，不允许"静默不生成"。
          $zips = @()
          $zips += Get-ChildItem -Path "$PWD" -Filter "AsterCore-win64-*.zip" -File -ErrorAction SilentlyContinue
          $zips += Get-ChildItem -Path "$PWD/dist" -Filter "AsterCore-win64-*.zip" -File -ErrorAction SilentlyContinue
          $zips = $zips | Sort-Object FullName -Unique
          if (-not $zips) { throw "没找到 AsterCore-win64-*.zip，无法生成校验文件" }
          foreach ($z in $zips) {
            $h = (Get-FileHash $z.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($z.Name)" | Set-Content "$($z.FullName).sha256" -Encoding ascii
            Write-Host "checksum: $($z.FullName) $h"
          }

      - name: Publish release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AsterCore-win64-*.zip
            AsterCore-win64-*.zip.sha256
          generate_release_notes: true
