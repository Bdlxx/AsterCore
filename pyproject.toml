[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astercore"
version = "0.3.0"
description = "栖星 AsterCore — QQ 机器人多后端框架（Windows 桌面版内核）"
requires-python = ">=3.10"
dependencies = [
    "websocket-client>=1.6",
    "requests>=2.28",
    # Windows 无系统 tzdata，而 wordlib/marry 用 ZoneInfo("Asia/Shanghai")
    "tzdata>=2024.1; platform_system=='Windows'",
]

[project.optional-dependencies]
web = ["flask>=2.2", "waitress>=3"]
desktop = ["flask>=2.2", "waitress>=3", "pywebview>=5", "pystray>=0.19", "pillow>=10"]
# 视频解析插件（video_parser_core）的依赖链：含传递依赖共 36 个包，已实测在
# Windows + CPython 3.12 上**全部有轮子、零编译**（见 docs/Windows-视频解析依赖链.md §1）。
# 版本锚定与 Linux 线上一致 —— 这是"跑起来才对得上"的东西，别随手升。
# ⚠ 包名是 `bilibili-api-python`（模块 bilibili_api）；PyPI 上另有老包 `bilibili_api`，别装错。
# ⚠ 它依赖的 `qrcode-terminal` 只有 sdist（纯 Python，装的时候**别**用 --only-binary=:all:）。
parser = [
    "aiohttp==3.14.3",
    "yt-dlp==2026.8.19",
    "bilibili-api-python==17.4.2",
    "curl_cffi==0.16.2",            # abi3：一套轮子通吃 cp310+
    "msgspec==0.21.1",
    "pillow==12.3.0",
    "json5==0.15.0",
    "beautifulsoup4==4.15.0",
    "httpx==0.28.1",
    "aiofiles==25.1.0",
    "APScheduler==3.11.3",
    "gallery-dl>=1.32",             # instagram 走 `python -m gallery_dl`
    "tqdm>=4.70",                   # 插件直接 import
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
astercore = ["py.typed"]
