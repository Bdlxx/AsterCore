[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astercore"
version = "0.1.0"
description = "栖星 AsterCore — QQ 机器人多后端框架（Windows 桌面版内核）"
requires-python = ">=3.10"
dependencies = [
    "websocket-client>=1.6",
    "requests>=2.28",
]

[project.optional-dependencies]
web = ["flask>=2.2"]
desktop = ["flask>=2.2", "pywebview>=5", "pystray>=0.19", "pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
astercore = ["py.typed"]
